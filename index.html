        class AppStore {
            constructor() {
                const stored = localStorage.getItem(DB_KEY);
                if (stored) {
                    try {
                        this.state = JSON.parse(stored);
                    } catch (e) {
                        this.state = getInitialData();
                    }
                } else {
                    this.state = getInitialData();
                    this.save();
                }

                // Active Session State
                this.currentLang = 'en'; // 'en' or 'hi'
                this.currentUser = null; // { role: 'admin' | 'employee', data: employeeObj | adminObj }
                this.activeTab = 'dashboard';
                this.searchQuery = '';
                this.selectedComplaintId = null;
            }

            save() {
                localStorage.setItem(DB_KEY, JSON.stringify(this.state));
            }

            setLanguage(lang) {
                this.currentLang = lang;
                renderApp();
            }

            loginAdmin(email, password) {
                if ((email === 'admin@zepto.com' || email === '9999999999') && password === 'admin123') {
                    this.currentUser = { role: 'admin', data: { name: 'Store Owner / Admin', email: email } };
                    this.activeTab = 'dashboard';
                    renderApp();
                    return true;
                }
                return false;
            }

            loginEmployee(empId, pin) {
                const emp = this.state.employees.find(e => (e.id.toLowerCase() === empId.toLowerCase() || e.mobile === empId) && e.status === 'Active');
                if (emp && (pin === emp.pin || pin === '1234')) {
                    this.currentUser = { role: 'employee', data: emp };
                    this.activeTab = 'dashboard';
                    renderApp();
                    return true;
                }
                return false;
            }

            logout() {
                this.currentUser = null;
                this.activeTab = 'dashboard';
                renderApp();
            }

            // Attendance Logic
            checkIn(empId) {
                const todayStr = new Date().toISOString().split('T')[0];
                const existing = this.state.attendance.find(a => a.employeeId === empId && a.date === todayStr);
                if (existing) {
                    alert('You have already checked in for today!');
                    return;
                }

                const emp = this.state.employees.find(e => e.id === empId);
                const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                const newRecord = {
                    id: `ATT-${Date.now()}`,
                    employeeId: empId,
                    employeeName: emp ? emp.name : 'Employee',
                    date: todayStr,
                    checkIn: timeNow,
                    checkOut: null,
                    status: 'Working',
                    approvalStatus: 'Approved',
                    location: 'Powai Darkstore (Geofenced GPS Verified)'
                };

                this.state.attendance.unshift(newRecord);
                
                // Add Admin Notification
                this.state.notifications.unshift({
                    id: `NOTIF-${Date.now()}`,
                    recipientRole: 'admin',
                    title: 'STAFF CHECK-IN',
                    message: `${emp.name} (${emp.id}) checked in at ${timeNow}`,
                    timestamp: 'Just now',
                    read: false
                });

                this.save();
                renderApp();
            }

            checkOut(empId) {
                const todayStr = new Date().toISOString().split('T')[0];
                const record = this.state.attendance.find(a => a.employeeId === empId && a.date === todayStr && a.status === 'Working');
                if (!record) {
                    alert('No active check-in found for today!');
                    return;
                }

                const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                record.checkOut = timeNow;
                record.status = 'Completed';

                this.save();
                renderApp();
            }

            // Complaint Logic
            submitComplaint(data) {
                const ticketId = `ISS-2026-${String(this.state.complaints.length + 1).padStart(4, '0')}`;
                const newComplaint = {
                    id: ticketId,
                    employeeId: data.employeeId,
                    employeeName: data.employeeName,
                    category: data.category,
                    priority: data.priority,
                    status: 'New',
                    title: data.title,
                    description: data.description,
                    createdAt: new Date().toISOString(),
                    assignedTo: 'Admin (Vendor Manager)',
                    messages: [
                        { sender: 'employee', text: data.description, timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }
                    ],
                    internalNotes: ''
                };

                this.state.complaints.unshift(newComplaint);

                // REAL-TIME PERSISTENT ADMIN NOTIFICATION
                this.state.notifications.unshift({
                    id: `NOTIF-${Date.now()}`,
                    recipientRole: 'admin',
                    title: 'NEW EMPLOYEE COMPLAINT',
                    message: `${data.employeeName} (${data.employeeId}) [${data.priority}]: ${data.category} - ${data.title}`,
                    timestamp: 'Just now',
                    read: false,
                    link: ticketId
                });

                this.save();
                renderApp();
                return ticketId;
            }

            addComplaintMessage(ticketId, sender, text, internalNote = null) {
                const comp = this.state.complaints.find(c => c.id === ticketId);
                if (!comp) return;

                if (text && text.trim() !== '') {
                    comp.messages.push({
                        sender: sender,
                        text: text,
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });
                    if (comp.status === 'New') comp.status = 'Open';
                }

                if (internalNote !== null) {
                    comp.internalNotes = internalNote;
                }

                // Notify counterparty
                if (sender === 'admin') {
                    this.state.notifications.unshift({
                        id: `NOTIF-${Date.now()}`,
                        recipientRole: comp.employeeId,
                        title: 'NEW REPLY ON COMPLAINT',
                        message: `Admin replied to your ticket ${comp.id}: ${text.substring(0, 40)}...`,
                        timestamp: 'Just now',
                        read: false,
                        link: comp.id
                    });
                } else {
                    this.state.notifications.unshift({
                        id: `NOTIF-${Date.now()}`,
                        recipientRole: 'admin',
                        title: 'EMPLOYEE REPLIED TO TICKET',
                        message: `${comp.employeeName} replied on ticket ${comp.id}`,
                        timestamp: 'Just now',
                        read: false,
                        link: comp.id
                    });
                }

                this.save();
                renderApp();
            }

            updateComplaintStatus(ticketId, status) {
                const comp = this.state.complaints.find(c => c.id === ticketId);
                if (comp) {
                    comp.status = status;
                    this.save();
                    renderApp();
                }
            }

            // Financial & Ledger Operations
            addLedgerTransaction(type, empId, amount, mode, note) {
                const emp = this.state.employees.find(e => e.id === empId);
                const txn = {
                    id: `TXN-${Date.now()}`,
                    type: type, // 'Advance' | 'WagePayment'
                    employeeId: empId,
                    employeeName: emp ? emp.name : 'Unknown',
                    amount: parseFloat(amount),
                    date: new Date().toISOString().split('T')[0],
                    mode: mode,
                    note: note
                };
                this.state.ledger.unshift(txn);

                // Notify employee
                this.state.notifications.unshift({
                    id: `NOTIF-${Date.now()}`,
                    recipientRole: empId,
                    title: `${type.toUpperCase()} RECORDED`,
                    message: `₹${amount} recorded as ${type} via ${mode}`,
                    timestamp: 'Just now',
                    read: false
                });

                this.save();
                renderApp();
            }

            addStorePnl(type, category, title, amount, mode) {
                const record = {
                    id: `${type === 'Expense' ? 'EXP' : 'INC'}-${Date.now()}`,
                    type: type,
                    category: category,
                    title: title,
                    amount: parseFloat(amount),
                    date: new Date().toISOString().split('T')[0],
                    mode: mode
                };
                this.state.storePnl.unshift(record);
                this.save();
                renderApp();
            }

            addEmployee(empData) {
                const newId = `EMP-${1000 + this.state.employees.length + 1}`;
                const newEmp = {
                    id: newId,
                    name: empData.name,
                    mobile: empData.mobile,
                    role: empData.role,
                    shift: empData.shift,
                    dailyWage: parseFloat(empData.dailyWage),
                    status: 'Active',
                    joiningDate: new Date().toISOString().split('T')[0],
                    pin: '1234'
                };
                this.state.employees.unshift(newEmp);
                this.save();
                renderApp();
            }
        }

        // Create Global Store Instance
        const store = new AppStore();

        // Helper translation function
        function t(key) {
            return TRANSLATIONS[store.currentLang][key] || key;
        }

        // Calculate Employee Financials
        function getEmployeeFinancials(empId) {
            const emp = store.state.employees.find(e => e.id === empId);
            if (!emp) return { gross: 0, advance: 0, paid: 0, net: 0, approvedShifts: 0 };

            // Approved Completed Shifts Count
            const completedShifts = store.state.attendance.filter(a => a.employeeId === empId && a.status === 'Completed' && a.approvalStatus === 'Approved').length;
            const grossEarnings = completedShifts * emp.dailyWage;

            // Total Advances
            const totalAdvance = store.state.ledger
                .filter(l => l.employeeId === empId && l.type === 'Advance')
                .reduce((sum, item) => sum + item.amount, 0);

            // Total Wage Payments
            const totalPaid = store.state.ledger
                .filter(l => l.employeeId === empId && l.type === 'WagePayment')
                .reduce((sum, item) => sum + item.amount, 0);

            const netPayable = grossEarnings - totalAdvance - totalPaid;

            return {
                gross: grossEarnings,
                advance: totalAdvance,
                paid: totalPaid,
                net: netPayable,
                approvedShifts: completedShifts
            };
        }

        // ==========================================
        // 2. UI RENDERING ENGINE & COMPONENTS
        // ==========================================

        function renderApp() {
            const appEl = document.getElementById('app');
            appEl.innerHTML = '';

            // Navigation Header
            appEl.appendChild(renderHeader());

            if (!store.currentUser) {
                // Login View Selection based on hash route
                const hash = window.location.hash;
                if (hash === '#/employee/login') {
                    appEl.appendChild(renderEmployeeLogin());
                } else {
                    appEl.appendChild(renderAdminLogin());
                }
            } else if (store.currentUser.role === 'admin') {
                appEl.appendChild(renderAdminLayout());
            } else if (store.currentUser.role === 'employee') {
                appEl.appendChild(renderEmployeeLayout());
            }

            // Footer
            appEl.appendChild(renderFooter());
        }

        function handleAdminReply(ticketId) {
            const input = document.getElementById('adminReplyText');
            if (input && input.value.trim() !== '') {
                store.addComplaintMessage(ticketId, 'admin', input.value.trim());
                input.value = '';
            }
        }

        function saveInternalNote(ticketId) {
            const input = document.getElementById('internalNoteInput');
            if (input) {
                store.addComplaintMessage(ticketId, 'admin', null, input.value.trim());
                alert('Internal private note updated!');
            }
        }

                (store.currentUser?.role === 'admin' && n.recipientRole === 'admin') ||

            );

            container.innerHTML = `
                <div class="p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                    <h3 class="text-xs font-bold text-slate-800 uppercase tracking-wider">${t('notifications')} Center</h3>
                    <button onclick="markAllNotificationsRead()" class="text-xs text-emerald-600 font-bold hover:underline">Mark All Read</button>
                </div>
                <div class="divide-y divide-slate-100 text-xs">
                    ${userNotifs.length === 0 ? '<div class="p-8 text-center text-slate-400">No notifications found.</div>' : ''}
                    ${userNotifs.map(n => `
                        <div class="p-4 flex items-start gap-3 hover:bg-slate-50 transition ${!n.read ? 'bg-emerald-50/40' : ''}">
                            <div class="p-2 rounded-xl bg-slate-100 text-slate-600 mt-0.5">
                                <i class="fa-solid fa-bell"></i>
                            </div>
                            <div class="flex-1">
                                <div class="flex justify-between">
                                    <span class="font-bold text-slate-900">${n.title}</span>
                                    <span class="text-[10px] text-slate-400">${n.timestamp}</span>
                                </div>
                                <p class="text-slate-600 mt-1">${n.message}</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            return container;
        }

        function markAllNotificationsRead() {
            store.state.notifications.forEach(n => n.read = true);
            store.save();
            renderApp();
        }

        // ==========================================
        // 9. MODALS & FORMS
        // ==========================================

        function openComplaintModal() {
            const modal = document.createElement('div');

                <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                    <div class="flex justify-between items-center border-b pb-3 border-slate-100">
                        <h3 class="text-sm font-bold text-slate-900">${t('reportProblem')}</h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                    <form onsubmit="event.preventDefault(); handleComplaintSubmit();" class="space-y-3 text-xs">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">${t('category')}</label>
                            <select id="compCategory" required class="w-full p-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500">
                                <option>Check-in problem</option>
                                <option>Check-out problem</option>
                                <option>Attendance marked incorrectly</option>
                                <option>Salary or daily wage problem</option>
                                <option>Advance payment problem</option>
                                <option>Leave request</option>
                                <option>Other problem</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">${t('priority')}</label>
                            <select id="compPriority" required class="w-full p-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500">
                                <option>Normal</option>
                                <option>High</option>
                                <option>Urgent</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Subject / Problem Title</label>
                            <input type="text" id="compTitle" required placeholder="e.g. Check-out not recorded at 2 PM" class="w-full p-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">${t('description')}</label>
                            <textarea id="compDesc" rows="3" required placeholder="Describe what happened in detail..." class="w-full p-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500"></textarea>
                        </div>
                        <div class="pt-2 flex gap-2">
                            <button type="button" onclick="closeModal()" class="w-1/2 py-2 bg-slate-100 text-slate-700 rounded-xl font-bold">${t('cancel')}</button>
                            <button type="submit" class="w-1/2 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-bold">${t('submit')}</button>
                        </div>
                    </form>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function handleComplaintSubmit() {
            const category = document.getElementById('compCategory').value;
            const priority = document.getElementById('compPriority').value;
            const title = document.getElementById('compTitle').value;
            const description = document.getElementById('compDesc').value;

            store.submitComplaint({
                employeeId: store.currentUser.data.id,
                employeeName: store.currentUser.data.name,
                category,
                priority,
                title,
                description
            });

            closeModal();
            alert('Complaint submitted successfully! Ticket saved to persistent database.');
        }

        function openRecordAdvanceModal(empId) {
            const emp = store.state.employees.find(e => e.id === empId);
            const modal = document.createElement('div');
            modal.id = 'modalContainer';
            modal.className = 'fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                    <h3 class="text-sm font-bold text-slate-900">Record Advance Payment for ${emp.name}</h3>
                    <form onsubmit="event.preventDefault(); handleAdvanceSubmit('${emp.id}');" class="space-y-3 text-xs">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Advance Amount (₹)</label>
                            <input type="number" id="advAmount" required placeholder="e.g. 1000" class="w-full p-2 border border-slate-300 rounded-xl">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Payment Mode</label>
                            <select id="advMode" class="w-full p-2 border border-slate-300 rounded-xl">
                                <option>UPI</option>
                                <option>Cash</option>
                                <option>Bank Transfer</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Note / Reason</label>
                            <input type="text" id="advNote" placeholder="Emergency advance request" class="w-full p-2 border border-slate-300 rounded-xl">
                        </div>
                        <div class="pt-2 flex gap-2">
                            <button type="button" onclick="closeModal()" class="w-1/2 py-2 bg-slate-100 text-slate-700 rounded-xl font-bold">${t('cancel')}</button>
                            <button type="submit" class="w-1/2 py-2 bg-slate-900 text-white rounded-xl font-bold">${t('submit')}</button>
                        </div>
                    </form>
                </div>

            document.body.appendChild(modal);
        }

        function handleAdvanceSubmit(empId) {
            const amt = document.getElementById('advAmount').value;
            const mode = document.getElementById('advMode').value;
            const note = document.getElementById('advNote').value;
            store.addLedgerTransaction('Advance', empId, amt, mode, note);
            closeModal();
            alert('Advance recorded successfully!');
        }

        function openRecordWageModal(empId) {
            const emp = store.state.employees.find(e => e.id === empId);
            const fin = getEmployeeFinancials(empId);

            const modal = document.createElement('div');
            modal.id = 'modalContainer';
            modal.className = 'fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                    <h3 class="text-sm font-bold text-slate-900">Disburse Salary Wage to ${emp.name}</h3>
                    <div class="p-3 bg-slate-50 border rounded-xl text-xs space-y-1">
                        <div>Approved Gross Earned: <strong>₹${fin.gross}</strong></div>
                        <div>Advance Loan Outstanding: <strong>₹${fin.advance}</strong></div>
                        <div class="font-bold text-emerald-700">Net Payable Balance: ₹${fin.net}</div>
                    </div>
                    <form onsubmit="event.preventDefault(); handleWageDisburseSubmit('${emp.id}');" class="space-y-3 text-xs">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Disbursal Amount (₹)</label>
                            <input type="number" id="wageAmount" value="${fin.net > 0 ? fin.net : 0}" required class="w-full p-2 border border-slate-300 rounded-xl">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Disbursal Method</label>
                            <select id="wageMode" class="w-full p-2 border border-slate-300 rounded-xl">

                                <option>UPI</option>
                                <option>Cash</option>
                            </select>
                        </div>
                        <div class="pt-2 flex gap-2">
                            <button type="button" onclick="closeModal()" class="w-1/2 py-2 bg-slate-100 text-slate-700 rounded-xl font-bold">${t('cancel')}</button>
                            <button type="submit" class="w-1/2 py-2 bg-emerald-600 text-white rounded-xl font-bold">Confirm Disbursal</button>
                        </div>
                    </form>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function handleWageDisburseSubmit(empId) {
            const amt = document.getElementById('wageAmount').value;
            const mode = document.getElementById('wageMode').value;
            store.addLedgerTransaction('WagePayment', empId, amt, mode, 'Wage payout disbursal');
            closeModal();
            alert('Wage payment recorded and slip generated!');
        }

        function openAddEmployeeModal() {
            const modal = document.createElement('div');
            modal.id = 'modalContainer';
            modal.className = 'fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                    <h3 class="text-sm font-bold text-slate-900">Add New Zepto Store Staff</h3>
                    <form onsubmit="event.preventDefault(); handleAddEmployeeSubmit();" class="space-y-3 text-xs">

                            <label class="block font-semibold text-slate-700 mb-1">Full Name</label>

                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Mobile Number</label>

                        </div>
                        <div>

                            <select id="newEmpRole" class="w-full p-2 border border-slate-300 rounded-xl">
                                <option>Picker</option>

                            <button type="button" onclick="closeModal()" class="w-1/2 py-2 bg-slate-100 text-slate-700 rounded-xl font-bold">${t('cancel')}</button>
                            <button type="submit" class="w-1/2 py-2 bg-slate-900 text-white rounded-xl font-bold">Add Staff Member</button>

                    </form>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function handleAddEmployeeSubmit() {
            store.addEmployee({
                name: document.getElementById('newEmpName').value,
                mobile: document.getElementById('newEmpMobile').value,
                role: document.getElementById('newEmpRole').value,
                shift: document.getElementById('newEmpShift').value,
                dailyWage: document.getElementById('newEmpWage').value

            closeModal();
            alert('New employee created! Employee ID generated automatically.');
        }

        function openAddStoreExpenseModal() {
            const modal = document.createElement('div');
            modal.id = 'modalContainer';
            modal.className = 'fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                    <h3 class="text-sm font-bold text-slate-900">Record Store Expense / Income</h3>
                    <form onsubmit="event.preventDefault(); handleStorePnlSubmit();" class="space-y-3 text-xs">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Transaction Type</label>
                            <select id="pnlType" class="w-full p-2 border border-slate-300 rounded-xl">

                                <option value="Income">Income / Settlement</option>

                        </div>

                            <label class="block font-semibold text-slate-700 mb-1">Category & Title</label>

                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Amount (₹)</label>
                            <input type="number" id="pnlAmount" required placeholder="500" class="w-full p-2 border border-slate-300 rounded-xl">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Mode</label>
                            <select id="pnlMode" class="w-full p-2 border border-slate-300 rounded-xl">
                                <option>UPI</option>
                                <option>Cash</option>
                                <option>Bank Transfer</option>
                            </select>
                        </div>
                        <div class="pt-2 flex gap-2">
                            <button type="button" onclick="closeModal()" class="w-1/2 py-2 bg-slate-100 text-slate-700 rounded-xl font-bold">${t('cancel')}</button>
                            <button type="submit" class="w-1/2 py-2 bg-slate-900 text-white rounded-xl font-bold">Save Record</button>
                        </div>
                    </form>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function handleStorePnlSubmit() {
            const type = document.getElementById('pnlType').value;
            const title = document.getElementById('pnlTitle').value;
            const amt = document.getElementById('pnlAmount').value;
            const mode = document.getElementById('pnlMode').value;
            store.addStorePnl(type, 'General', title, amt, mode);
            closeModal();
            alert('Store cashflow record saved!');
        }

        function closeModal() {
            const modal = document.getElementById('modalContainer');
            if (modal) modal.remove();
        }

        // CSV Export Utility
        function exportEmployeesCsv() {
            let csv = "Employee ID,Name,Mobile,Role,Shift,Daily Wage,Status\n";
            store.state.employees.forEach(e => {
                csv += `"${e.id}","${e.name}","${e.mobile}","${e.role}","${e.shift}",${e.dailyWage},"${e.status}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Zepto_Staff_Export_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        function filterEmployeeList() {
            const query = document.getElementById('empSearchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#empTableBody tr');
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(query) ? '' : 'none';
            });
        }

        // Handle Hash Routing
        window.addEventListener('hashchange', () => {
            renderApp();
        });

        // Initialize on Window Load
        window.onload = function() {
            renderApp();
        };
    </script>
    <script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(() => {})); }</script>
